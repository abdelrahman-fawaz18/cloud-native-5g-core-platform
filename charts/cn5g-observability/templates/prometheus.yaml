apiVersion: v1
kind: Service
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cn5g-observability.selectorLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
  ports:
    - {name: http, port: 9090, targetPort: http, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
spec:
  serviceName: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "cn5g-observability.selectorLabels" (dict "root" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cn5g-observability.selectorLabels" (dict "root" . "component" "prometheus") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/prometheus-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus") }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: {{ include "cn5g-observability.image" .Values.images.prometheus }}
          imagePullPolicy: {{ .Values.images.prometheus.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.global.retention }}
            - --storage.tsdb.retention.size={{ .Values.prometheus.retentionSize }}
            - --web.enable-lifecycle
          ports:
            - {name: http, containerPort: 9090, protocol: TCP}
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus-config") }}
            items:
              - {key: prometheus.yml, path: prometheus.yml}
              - {key: alerts.yaml, path: rules/alerts.yaml}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "cn5g-observability.retainedClaimTemplateLabels" (dict "root" . "component" "prometheus") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClassName | quote }}
        resources:
          requests: {storage: {{ .Values.prometheus.storageSize }}}
