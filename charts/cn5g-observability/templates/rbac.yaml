apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "prometheus") }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "kube-state-metrics") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "kube-state-metrics") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "kube-state-metrics") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "kube-state-metrics") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
---
{{- range $namespace := list .Values.global.coreNamespace .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" $ "component" "kube-state-metrics") }}
  namespace: {{ $namespace }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" $ "component" "kube-state-metrics") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cn5g-observability.componentName" (dict "root" $ "component" "kube-state-metrics") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cn5g-observability.componentName" (dict "root" $ "component" "kube-state-metrics") }}
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
