apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "loki-config") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "loki") | nindent 4 }}
data:
  loki.yaml: |-
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      retention_period: {{ .Values.global.retention }}
      allow_structured_metadata: true
      volume_enabled: true
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "loki") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "loki") | nindent 4 }}
spec:
  selector:
    {{- include "cn5g-observability.selectorLabels" (dict "root" . "component" "loki") | nindent 4 }}
  ports:
    - {name: http, port: 3100, targetPort: http, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "loki") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "loki") | nindent 4 }}
spec:
  serviceName: {{ include "cn5g-observability.componentName" (dict "root" . "component" "loki") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "cn5g-observability.selectorLabels" (dict "root" . "component" "loki") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cn5g-observability.selectorLabels" (dict "root" . "component" "loki") | nindent 8 }}
      annotations:
        cn5g.io/config-revision: "1"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loki
          image: {{ include "cn5g-observability.image" .Values.images.loki }}
          imagePullPolicy: {{ .Values.images.loki.pullPolicy }}
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - {name: http, containerPort: 3100, protocol: TCP}
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /var/loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "loki-config") }}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "cn5g-observability.retainedClaimTemplateLabels" (dict "root" . "component" "loki") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClassName | quote }}
        resources:
          requests: {storage: {{ .Values.loki.storageSize }}}
