apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "resilience-results") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "resilience-results") | nindent 4 }}
data:
  metrics: |-
{{ .Files.Get "files/resilience-reviewed.prom" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "resilience-results") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "resilience-results") | nindent 4 }}
spec:
  selector:
    {{- include "cn5g-observability.selectorLabels" (dict "root" . "component" "resilience-results") | nindent 4 }}
  ports:
    - {name: metrics, port: 8080, targetPort: metrics, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "resilience-results") }}
  labels:
    {{- include "cn5g-observability.componentLabels" (dict "root" . "component" "resilience-results") | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "cn5g-observability.selectorLabels" (dict "root" . "component" "resilience-results") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cn5g-observability.selectorLabels" (dict "root" . "component" "resilience-results") | nindent 8 }}
      annotations:
        cn5g.io/reviewed-results-sha256: {{ .Files.Get "files/resilience-reviewed.prom" | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: exporter
          image: {{ include "cn5g-observability.localImage" .Values.images.alertExercise }}
          imagePullPolicy: {{ .Values.images.alertExercise.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              cp /config/metrics /metrics/metrics
              exec /bin/busybox-extras httpd -f -p 8080 -h /metrics
          ports:
            - {name: metrics, containerPort: 8080, protocol: TCP}
          startupProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.reviewedResults.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: metrics, mountPath: /metrics}
      volumes:
        - name: config
          configMap:
            name: {{ include "cn5g-observability.componentName" (dict "root" . "component" "resilience-results") }}
        - name: metrics
          emptyDir: {medium: Memory, sizeLimit: 2Mi}
