subscriberSecret:
  existingSecret: cn5g-subscriber
  ueConfigKey: ue.yaml
  subscriberScriptKey: subscriber-init.js
  imsiKey: imsi

# Phase 5 is an explicit overlay so the accepted single-UE Phase 4 release can
# still be rendered and restored without reconstructing historical values.
phase05:
  enabled: false
  ueReplicas: 5
  subscriberSecret:
    existingSecret: cn5g-subscribers-phase05
    planKey: plan.json
    subscriberScriptKey: subscriber-init.js
  sessions:
    - name: internet
      pool: 10.60.0.0/24
      gateway: 10.60.0.1
      tunDevice: ogstun
      endpoint: data-internet
      routeTable: 1060
      rulePriority: 1060
    - name: enterprise
      pool: 10.61.0.0/24
      gateway: 10.61.0.1
      tunDevice: ogstun2
      endpoint: data-enterprise
      routeTable: 1061
      rulePriority: 1061

# Phase 6 adds one least-privileged metrics sidecar to each Phase 5 UE Pod.
# The sidecar performs a bounded, synthetic user-plane request through the
# existing UE TUN and exposes only ordinal/DNN labels; subscriber identities
# never enter the metric label set.
phase06:
  enabled: false
  probeIntervalSeconds: 15
  metricsPort: 9101
  resources:
    requests: {cpu: 5m, memory: 8Mi}
    limits: {cpu: 50m, memory: 32Mi}

# Phase 7 adds an idle benchmark client to each UE network namespace and one
# iperf3 server to each controlled DNN endpoint. The lifecycle helper starts
# traffic only inside explicit, bounded experiment windows.
phase07:
  enabled: false
  iperfPort: 5201
  iperfPortCount: 5
  resources:
    requests: {cpu: 5m, memory: 8Mi}
    limits: {cpu: "1", memory: 64Mi}

mongodb:
  storageClassName: standard
