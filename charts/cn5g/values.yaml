subscriberSecret:
  existingSecret: cn5g-subscriber
  ueConfigKey: ue.yaml
  subscriberScriptKey: subscriber-init.js
  imsiKey: imsi

# The accepted five-UE/two-DNN topology is the chart default. A separate
# single-UE profile is retained only for focused protocol smoke tests.
platform:
  enabled: true
  ueReplicas: 5
  subscriberSecret:
    existingSecret: cn5g-subscribers
    planKey: plan.json
    subscriberScriptKey: subscriber-init.js
  sessions:
    - name: internet
      pool: 10.60.0.0/24
      gateway: 10.60.0.1
      tunDevice: ogstun
      endpoint: data-internet
      routeTable: 1060
      rulePriority: 1060
    - name: enterprise
      pool: 10.61.0.0/24
      gateway: 10.61.0.1
      tunDevice: ogstun2
      endpoint: data-enterprise
      routeTable: 1061
      rulePriority: 1061

# The default platform exposes bounded per-UE operational metrics. The separate
# observability chart collects these metrics together with cluster telemetry.
# The sidecar performs a bounded, synthetic user-plane request through the
# existing UE TUN and exposes only ordinal/DNN labels; subscriber identities
# never enter the metric label set.
observability:
  enabled: true
  probeIntervalSeconds: 15
  metricsPort: 9101
  resources:
    requests: {cpu: 5m, memory: 8Mi}
    limits: {cpu: 50m, memory: 32Mi}

# performance campaigns add an idle benchmark client to each UE network namespace and one
# iperf3 server to each controlled DNN endpoint. The lifecycle helper starts
# traffic only inside explicit, bounded experiment windows.
performance:
  enabled: false
  iperfPort: 5201
  iperfPortCount: 5
  resources:
    requests: {cpu: 5m, memory: 8Mi}
    limits: {cpu: "1", memory: 64Mi}

mongodb:
  storageClassName: standard
  storageSize: 2Gi
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}

