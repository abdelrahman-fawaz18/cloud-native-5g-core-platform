apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cn5g.componentName" (dict "root" . "component" "gnb") }}
  labels:
    {{- include "cn5g.componentLabels" (dict "root" . "component" "gnb") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "cn5g.selectorLabels" (dict "root" . "component" "gnb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cn5g.selectorLabels" (dict "root" . "component" "gnb") | nindent 8 }}
      annotations:
        cn5g.io/rollout-token: {{ .Values.global.ranRolloutToken | quote }}
        checksum/ueransim-config: {{ include (print .Template.BasePath "/configmap-ueransim.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "cn5g.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: render-config
          image: {{ include "cn5g.image" .Values.images.ueransim }}
          imagePullPolicy: {{ .Values.images.ueransim.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              for attempt in $(seq 1 60); do
                AMF_IP=$(getent ahostsv4 {{ include "cn5g.componentName" (dict "root" . "component" "amf") }} | awk 'NR == 1 {print $1}')
                test -n "$AMF_IP" && break;
                sleep 2;
              done;
              test -n "${AMF_IP:-}";
              sed \
                -e "s/__POD_IP__/${POD_IP}/g" \
                -e "s/__AMF_IP__/${AMF_IP}/g" \
                /config-source/gnb.yaml > /etc/ueransim/gnb.yaml;
              test -s /etc/ueransim/gnb.yaml
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.ueransim.resources | nindent 12 }}
          volumeMounts:
            - {name: config-source, mountPath: /config-source, readOnly: true}
            - {name: config-runtime, mountPath: /etc/ueransim}
      containers:
        - name: gnb
          image: {{ include "cn5g.image" .Values.images.ueransim }}
          imagePullPolicy: {{ .Values.images.ueransim.pullPolicy }}
          args: ["gnb"]
          ports:
            - {name: radio, containerPort: 4997, protocol: UDP}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -s /etc/ueransim/gnb.yaml && kill -0 1"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  last_event=$(grep -h -E
                  'NG Setup procedure is successful|Association terminated for AMF'
                  /opt/ueransim/logs/* 2>/dev/null | tail -n 1);
                  printf '%s\n' "$last_event" |
                  grep -Fq 'NG Setup procedure is successful'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  last_event=$(grep -h -E
                  'NG Setup procedure is successful|Association terminated for AMF'
                  /opt/ueransim/logs/* 2>/dev/null | tail -n 1);
                  printf '%s\n' "$last_event" |
                  grep -Fq 'NG Setup procedure is successful'
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ueransim.resources | nindent 12 }}
          volumeMounts:
            - {name: config-runtime, mountPath: /etc/ueransim, readOnly: true}
            - {name: logs, mountPath: /opt/ueransim/logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config-source
          configMap: {name: {{ include "cn5g.fullname" . }}-ueransim-config}
        - name: config-runtime
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: logs
          emptyDir: {sizeLimit: 32Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: apps/v1
kind: {{ if .Values.phase05.enabled }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ include "cn5g.componentName" (dict "root" . "component" "ue") }}
  labels:
    {{- include "cn5g.componentLabels" (dict "root" . "component" "ue") | nindent 4 }}
spec:
  replicas: {{ if .Values.phase05.enabled }}{{ .Values.phase05.ueReplicas }}{{ else }}1{{ end }}
  {{- if .Values.phase05.enabled }}
  serviceName: {{ include "cn5g.componentName" (dict "root" . "component" "ue") }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      {{- include "cn5g.selectorLabels" (dict "root" . "component" "ue") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cn5g.selectorLabels" (dict "root" . "component" "ue") | nindent 8 }}
      annotations:
        cn5g.io/rollout-token: {{ .Values.global.ranRolloutToken | quote }}
    spec:
      serviceAccountName: {{ include "cn5g.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-subscriber
          image: {{ include "cn5g.kindLoadedImage" .Values.images.mongodb }}
          imagePullPolicy: {{ .Values.images.mongodb.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              {{- if .Values.phase05.enabled }}
              case "$POD_NAME" in
                {{ include "cn5g.componentName" (dict "root" . "component" "ue") }}-[0-4]) ordinal=${POD_NAME##*-} ;;
                *) echo "unexpected UE Pod identity" >&2; exit 2 ;;
              esac
              IMSI=$(cat "/secret/imsi-${ordinal}")
              {{- else }}
              IMSI=$(cat /secret/{{ .Values.subscriberSecret.imsiKey }});
              {{- end }}
              case "$IMSI" in (*[!0-9]*|'') exit 2;; esac;
              for attempt in $(seq 1 90); do
                if mongosh --quiet \
                  "mongodb://{{ include "cn5g.componentName" (dict "root" . "component" "mongodb") }}:27017/open5gs" \
                  --eval "quit(db.subscribers.countDocuments({imsi:'${IMSI}'}) === 1 ? 0 : 1)"; then
                  exit 0;
                fi
                sleep 2;
              done;
              exit 1
          {{- if .Values.phase05.enabled }}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.subscriberJob.resources | nindent 12 }}
          volumeMounts:
            - {name: subscriber-secret, mountPath: /secret, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: render-config
          image: {{ include "cn5g.image" .Values.images.ueransim }}
          imagePullPolicy: {{ .Values.images.ueransim.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              for attempt in $(seq 1 90); do
                GNB_IP=$(getent ahostsv4 {{ include "cn5g.componentName" (dict "root" . "component" "gnb") }} | awk 'NR == 1 {print $1}')
                test -n "$GNB_IP" && break;
                sleep 2;
              done;
              test -n "${GNB_IP:-}";
              {{- if .Values.phase05.enabled }}
              case "$POD_NAME" in
                {{ include "cn5g.componentName" (dict "root" . "component" "ue") }}-[0-4]) ordinal=${POD_NAME##*-} ;;
                *) echo "unexpected UE Pod identity" >&2; exit 2 ;;
              esac
              ue_config="/secret/ue-${ordinal}.yaml"
              {{- else }}
              ue_config="/secret/{{ .Values.subscriberSecret.ueConfigKey }}"
              {{- end }}
              sed "s/__GNB_IP__/${GNB_IP}/g" \
                "$ue_config" \
                > /etc/ueransim/ue.yaml;
              test -s /etc/ueransim/ue.yaml
          {{- if .Values.phase05.enabled }}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.ueransim.resources | nindent 12 }}
          volumeMounts:
            - {name: subscriber-secret, mountPath: /secret, readOnly: true}
            - {name: config-runtime, mountPath: /etc/ueransim}
      containers:
        - name: ue
          image: {{ include "cn5g.image" .Values.images.ueransim }}
          imagePullPolicy: {{ .Values.images.ueransim.pullPolicy }}
          args: ["ue"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -s /etc/ueransim/ue.yaml && kill -0 1"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              {{- if .Values.phase05.enabled }}
              command:
                - /bin/sh
                - -ec
                - |-
                  grep -R -q 'Initial Registration is successful' /opt/ueransim/logs
                  grep -R -q 'PDU Session establishment is successful' /opt/ueransim/logs
                  grep -R -q 'Connection setup for PDU session.*is successful' /opt/ueransim/logs
                  address=$(ip -o -4 address show dev uesimtun0 | awk '{print $4}')
                  case "$address" in
                    10.60.0.*/*|10.61.0.*/*) ;;
                    *) exit 1 ;;
                  esac
                  ip -4 rule show | grep -q 'lookup rt_uesimtun0'
                  ip -4 route show table rt_uesimtun0 | grep -q '^default dev uesimtun0'
              {{- else }}
              command: ["ueransim-healthcheck", "ue"]
              {{- end }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "kill -0 1"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ueransim.resources | nindent 12 }}
          volumeMounts:
            - {name: tun-device, mountPath: /dev/net/tun}
            - {name: config-runtime, mountPath: /etc/ueransim, readOnly: true}
            - {name: iproute2, mountPath: /etc/iproute2}
            - {name: logs, mountPath: /opt/ueransim/logs}
            - {name: tmp, mountPath: /tmp}
        {{- if .Values.phase06.enabled }}
        - name: user-plane-metrics
          image: {{ include "cn5g.image" .Values.images.ueProbe }}
          imagePullPolicy: {{ .Values.images.ueProbe.pullPolicy }}
          command: ["python3", "/opt/cn5g/probe.py"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: metrics, containerPort: {{ .Values.phase06.metricsPort }}, protocol: TCP}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          startupProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.phase06.resources | nindent 12 }}
          volumeMounts:
            - {name: ue-probe, mountPath: /opt/cn5g, readOnly: true}
        {{- end }}
        {{- if .Values.phase07.enabled }}
        - name: benchmark-client
          image: {{ include "cn5g.image" .Values.images.benchmark }}
          imagePullPolicy: {{ .Values.images.benchmark.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args: ["exec sleep infinity"]
          env:
            - {name: TMPDIR, value: /tmp}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -d /sys/class/net/uesimtun0"]
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "kill -0 1"]
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.phase07.resources | nindent 12 }}
          volumeMounts:
            - {name: benchmark-tmp, mountPath: /tmp}
        {{- end }}
      volumes:
        - name: tun-device
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - name: subscriber-secret
          secret:
            secretName: {{ if .Values.phase05.enabled }}{{ .Values.phase05.subscriberSecret.existingSecret }}{{ else }}{{ .Values.subscriberSecret.existingSecret }}{{ end }}
            {{- if not .Values.phase05.enabled }}
            items:
              - {key: {{ .Values.subscriberSecret.ueConfigKey }}, path: {{ .Values.subscriberSecret.ueConfigKey }}}
              - {key: {{ .Values.subscriberSecret.imsiKey }}, path: {{ .Values.subscriberSecret.imsiKey }}}
            {{- end }}
        - name: config-runtime
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: iproute2
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: logs
          emptyDir: {sizeLimit: 32Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        {{- if .Values.phase06.enabled }}
        - name: ue-probe
          configMap:
            name: {{ include "cn5g.fullname" . }}-ue-probe
            defaultMode: 0444
        {{- end }}
        {{- if .Values.phase07.enabled }}
        - name: benchmark-tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        {{- end }}
