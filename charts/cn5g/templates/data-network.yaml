{{- $root := . -}}
{{- $endpoints := list (dict "component" "data-network" "identity" "baseline") -}}
{{- if .Values.platform.enabled -}}
{{- $endpoints = list
      (dict "component" "data-internet" "identity" "internet")
      (dict "component" "data-enterprise" "identity" "enterprise") -}}
{{- end -}}
{{- range $endpoint := $endpoints }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cn5g.componentName" (dict "root" $root "component" $endpoint.component) }}
  labels:
    {{- include "cn5g.componentLabels" (dict "root" $root "component" $endpoint.component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cn5g.selectorLabels" (dict "root" $root "component" $endpoint.component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cn5g.selectorLabels" (dict "root" $root "component" $endpoint.component) | nindent 8 }}
      annotations:
        cn5g.io/rollout-token: {{ $root.Values.global.rolloutToken | quote }}
        cn5g.io/expected-image-id: {{ $root.Values.images.dataNetwork.expectedImageID | quote }}
    spec:
      serviceAccountName: {{ include "cn5g.serviceAccountName" $root }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      {{- if $root.Values.platform.enabled }}
      initContainers:
        - name: render-content
          image: {{ include "cn5g.image" $root.Values.images.dataNetwork }}
          imagePullPolicy: {{ $root.Values.images.dataNetwork.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              printf '%s\n' 'cn5g-data-network-ok' > /rendered/healthz
              printf '%s\n' 'cn5g-dnn={{ $endpoint.identity }}' > /rendered/index.html
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml $root.Values.dataNetwork.resources | nindent 12 }}
          volumeMounts:
            - {name: rendered-content, mountPath: /rendered}
      {{- end }}
      containers:
        - name: data-network
          image: {{ include "cn5g.image" $root.Values.images.dataNetwork }}
          imagePullPolicy: {{ $root.Values.images.dataNetwork.pullPolicy }}
          command: ["/bin/busybox-extras", "httpd"]
          args: ["-f", "-p", "8080", "-h", "/srv"]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "ss -H -lnt | grep -q ':8080 '"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "kill -0 1"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml $root.Values.dataNetwork.resources | nindent 12 }}
          {{- if $root.Values.platform.enabled }}
          volumeMounts:
            - {name: rendered-content, mountPath: /srv, readOnly: true}
          {{- end }}
        {{- if $root.Values.performance.enabled }}
        - name: benchmark-server
          image: {{ include "cn5g.image" $root.Values.images.benchmark }}
          imagePullPolicy: {{ $root.Values.images.benchmark.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              pids=""
              cleanup() {
                trap - TERM INT EXIT
                test -z "$pids" || kill $pids 2>/dev/null || true
                test -z "$pids" || wait $pids 2>/dev/null || true
              }
              trap cleanup TERM INT EXIT
              {{- range $ordinal := until ($root.Values.performance.iperfPortCount | int) }}
              iperf3 --server --port {{ add ($root.Values.performance.iperfPort | int) $ordinal }} &
              pids="$pids $!"
              {{- end }}
              while sleep 5; do
                for pid in $pids; do
                  kill -0 "$pid" 2>/dev/null || exit 1
                done
              done
          env:
            - {name: TMPDIR, value: /tmp}
          ports:
            {{- range $ordinal := until ($root.Values.performance.iperfPortCount | int) }}
            - {name: iperf-tcp-{{ $ordinal }}, containerPort: {{ add ($root.Values.performance.iperfPort | int) $ordinal }}, protocol: TCP}
            - {name: iperf-udp-{{ $ordinal }}, containerPort: {{ add ($root.Values.performance.iperfPort | int) $ordinal }}, protocol: UDP}
            {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |-
                  {{- range $ordinal := until ($root.Values.performance.iperfPortCount | int) }}
                  ss -H -lnt | grep -q ':{{ add ($root.Values.performance.iperfPort | int) $ordinal }} '
                  {{- end }}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |-
                  {{- range $ordinal := until ($root.Values.performance.iperfPortCount | int) }}
                  ss -H -lnt | grep -q ':{{ add ($root.Values.performance.iperfPort | int) $ordinal }} '
                  {{- end }}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "kill -0 1"]
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml $root.Values.performance.resources | nindent 12 }}
          volumeMounts:
            - {name: benchmark-tmp, mountPath: /tmp}
        {{- end }}
      {{- if $root.Values.platform.enabled }}
      volumes:
        - name: rendered-content
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        {{- if $root.Values.performance.enabled }}
        - name: benchmark-tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        {{- end }}
      {{- end }}
{{- end }}
