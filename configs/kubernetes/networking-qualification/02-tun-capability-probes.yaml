apiVersion: v1
kind: Pod
metadata:
  name: tun-denied
  namespace: cn5g-feasibility
  labels:
    app.kubernetes.io/name: tun-denied
    app.kubernetes.io/part-of: cn5g-networking-tun
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: cn5g/feasibility-probe:0.1.0
      imagePullPolicy: Never
      command: ["/bin/sh", "-ec"]
      args:
        - |
          if cn5g-feasibility-probe tun-once cn5gdeny0 10.63.0.1/30; then
            echo "tun_without_net_admin=unexpected_success"
            exit 1
          fi
          echo "tun_without_net_admin=denied_as_expected"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        privileged: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      volumeMounts:
        - name: tun-device
          mountPath: /dev/net/tun
  volumes:
    - name: tun-device
      hostPath:
        path: /dev/net/tun
        type: CharDevice
---
apiVersion: v1
kind: Pod
metadata:
  name: tun-allowed
  namespace: cn5g-feasibility
  labels:
    app.kubernetes.io/name: tun-allowed
    app.kubernetes.io/part-of: cn5g-networking-tun
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: cn5g/feasibility-probe:0.1.0
      imagePullPolicy: Never
      args: ["tun-hold", "cn5gtun0", "10.63.0.1/30"]
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - >-
              test -d /sys/class/net/cn5gtun0 &&
              ip -4 address show dev cn5gtun0 |
              grep -Fq '10.63.0.1/30'
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 30
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        privileged: false
        capabilities:
          drop: ["ALL"]
          add: ["NET_ADMIN"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      volumeMounts:
        - name: tun-device
          mountPath: /dev/net/tun
  volumes:
    - name: tun-device
      hostPath:
        path: /dev/net/tun
        type: CharDevice
