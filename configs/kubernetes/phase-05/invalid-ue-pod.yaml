apiVersion: v1
kind: Pod
metadata:
  name: cn5g-phase05-invalid-ue
  namespace: cn5g
  labels:
    app.kubernetes.io/name: cn5g
    app.kubernetes.io/instance: cn5g
    app.kubernetes.io/component: invalid-ue
    app.kubernetes.io/part-of: cn5g-core
    app.kubernetes.io/managed-by: cn5g-phase05-lab
spec:
  restartPolicy: Never
  serviceAccountName: cn5g-workload
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 5
  securityContext:
    seccompProfile: {type: RuntimeDefault}
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  initContainers:
    - name: render-config
      image: cn5g/ueransim:3.2.8
      imagePullPolicy: Never
      command: ["/bin/sh", "-ec"]
      args:
        - |-
          for attempt in $(seq 1 60); do
            GNB_IP=$(getent ahostsv4 cn5g-gnb | awk 'NR == 1 {print $1}')
            test -n "$GNB_IP" && break
            sleep 2
          done
          test -n "${GNB_IP:-}"
          sed "s/__GNB_IP__/${GNB_IP}/g" /secret/ue-invalid.yaml \
            > /etc/ueransim/ue.yaml
          test -s /etc/ueransim/ue.yaml
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      resources:
        requests: {cpu: 5m, memory: 16Mi}
        limits: {cpu: 100m, memory: 128Mi}
      volumeMounts:
        - {name: invalid-config, mountPath: /secret, readOnly: true}
        - {name: config-runtime, mountPath: /etc/ueransim}
  containers:
    - name: ue
      image: cn5g/ueransim:3.2.8
      imagePullPolicy: Never
      args: ["ue"]
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
          add: ["NET_ADMIN", "NET_RAW"]
      resources:
        requests: {cpu: 5m, memory: 16Mi}
        limits: {cpu: 100m, memory: 128Mi}
      volumeMounts:
        - {name: tun-device, mountPath: /dev/net/tun}
        - {name: config-runtime, mountPath: /etc/ueransim, readOnly: true}
        - {name: iproute2, mountPath: /etc/iproute2}
        - {name: logs, mountPath: /opt/ueransim/logs}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: tun-device
      hostPath: {path: /dev/net/tun, type: CharDevice}
    - name: invalid-config
      secret: {secretName: cn5g-phase05-invalid-ue}
    - name: config-runtime
      emptyDir: {medium: Memory, sizeLimit: 8Mi}
    - name: iproute2
      emptyDir: {medium: Memory, sizeLimit: 8Mi}
    - name: logs
      emptyDir: {sizeLimit: 16Mi}
    - name: tmp
      emptyDir: {medium: Memory, sizeLimit: 16Mi}
