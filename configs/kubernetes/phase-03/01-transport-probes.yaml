apiVersion: v1
kind: Service
metadata:
  name: transport-server
  namespace: cn5g-feasibility
  labels:
    app.kubernetes.io/name: transport-server
    app.kubernetes.io/part-of: cn5g-phase-03
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: transport-server
  ports:
    - name: tcp-baseline
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: udp-baseline
      protocol: UDP
      port: 9091
      targetPort: 9091
    - name: n2-sctp
      protocol: SCTP
      port: 38412
      targetPort: 38412
    - name: n4-pfcp
      protocol: UDP
      port: 8805
      targetPort: 8805
    - name: n3-gtpu
      protocol: UDP
      port: 2152
      targetPort: 2152
---
apiVersion: v1
kind: Pod
metadata:
  name: transport-server
  namespace: cn5g-feasibility
  labels:
    app.kubernetes.io/name: transport-server
    app.kubernetes.io/part-of: cn5g-phase-03
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: tcp-baseline
      image: cn5g/feasibility-probe:0.1.0
      imagePullPolicy: Never
      args: ["tcp-server", "8080"]
      ports:
        - name: tcp-baseline
          containerPort: 8080
          protocol: TCP
      securityContext: &unprivileged
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources: &probe_resources
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
    - name: udp-baseline
      image: cn5g/feasibility-probe:0.1.0
      imagePullPolicy: Never
      args: ["udp-server", "9091"]
      ports:
        - name: udp-baseline
          containerPort: 9091
          protocol: UDP
      securityContext: *unprivileged
      resources: *probe_resources
    - name: n2-sctp
      image: cn5g/feasibility-probe:0.1.0
      imagePullPolicy: Never
      args: ["sctp-server", "38412"]
      ports:
        - name: n2-sctp
          containerPort: 38412
          protocol: SCTP
      securityContext: *unprivileged
      resources: *probe_resources
    - name: n4-pfcp
      image: cn5g/feasibility-probe:0.1.0
      imagePullPolicy: Never
      args: ["udp-server", "8805"]
      ports:
        - name: n4-pfcp
          containerPort: 8805
          protocol: UDP
      securityContext: *unprivileged
      resources: *probe_resources
    - name: n3-gtpu
      image: cn5g/feasibility-probe:0.1.0
      imagePullPolicy: Never
      args: ["udp-server", "2152"]
      ports:
        - name: n3-gtpu
          containerPort: 2152
          protocol: UDP
      securityContext: *unprivileged
      resources: *probe_resources
---
apiVersion: v1
kind: Pod
metadata:
  name: transport-client
  namespace: cn5g-feasibility
  labels:
    app.kubernetes.io/name: transport-client
    app.kubernetes.io/part-of: cn5g-phase-03
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: cn5g/feasibility-probe:0.1.0
      imagePullPolicy: Never
      command: ["/bin/sleep"]
      args: ["infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
