# Single-node, disposable Networking qualification feasibility cluster. The cluster name and
# digest-pinned node image are supplied by scripts/cluster-lifecycle.sh.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: ipv4
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  kubeProxyMode: "iptables"
nodes:
  - role: control-plane
