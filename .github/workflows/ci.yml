name: Phase 10 release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-deterministic-gates:
    name: Safe deterministic gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned Python test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r requirements-ci.txt
      - name: Install Helm 4.2.0 from the official checksum-verified release
        env:
          HELM_VERSION: v4.2.0
          HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
        run: |
          archive="$RUNNER_TEMP/helm.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/helm"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run the canonical safe gate
        run: ./scripts/phase09-lab.sh safe-gate
      - name: Verify final publication evidence
        run: ./scripts/check-phase10-release.py public-release
      - name: Upload restricted machine-readable scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase09-repository-reports
          path: artifacts/phase-09/scans/
          if-no-files-found: warn
          retention-days: 14

  image-supply-chain:
    name: Image build, scan, and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
      - name: Bootstrap checksum-verified security tools
        run: ./scripts/phase09-lab.sh bootstrap-tools
      - name: Build, scan, and inventory all released images
        run: ./scripts/phase09-lab.sh image-gate
      - name: Upload image scans and SPDX SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase09-image-supply-chain
          path: |
            artifacts/phase-09/scans/images/
            artifacts/phase-09/sbom/
          if-no-files-found: warn
          retention-days: 14

  hosted-release-gate:
    name: Aggregate hosted release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [safe-deterministic-gates, image-supply-chain]
    steps:
      - name: Confirm the hosted boundary
        run: |
          printf '%s\n' 'phase10_hosted_release_gate=pass'
          printf '%s\n' 'privileged_5g_integration=not-run-see-local-gate'
