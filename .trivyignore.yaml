vulnerabilities:
  - id: CVE-2026-14456
    purls:
      - "pkg:apk/alpine/libcrypto3@3.5.7-r0?arch=x86_64&distro=3.22.5"
      - "pkg:apk/alpine/libssl3@3.5.7-r0?arch=x86_64&distro=3.22.5"
    statement: >-
      The affected OpenSSL QUIC server code is not used by these images. The
      data-network image serves HTTP through BusyBox, and the benchmark image
      runs iperf3; neither exposes a QUIC listener. Remove this exception when
      the pinned Alpine 3.22 base includes OpenSSL 3.5.8-r0 or later.
    expired_at: 2026-11-30

misconfigurations:
  - id: KSV-0119
    paths:
      - "charts/cn5g/templates/deployments-ran.yaml"
      - "configs/kubernetes/networking-qualification/03-n6-routing-probes.yaml"
      - "configs/kubernetes/platform/invalid-ue-pod.yaml"
    statement: >-
      NET_RAW is restricted to synthetic UE and feasibility ICMP probes. The
      released chart still drops ALL capabilities first, never uses privileged
      mode, and the repository Conftest policy rejects NET_RAW everywhere else.
    expired_at: 2027-08-20
  - id: KSV-0009
    paths:
      - "configs/kubernetes/networking-qualification/03-n6-routing-probes.yaml"
    statement: >-
      The short-lived networking-qualification node observer deliberately enters the disposable
      kind node network to prove an N6 route. It is not part of the released
      Helm topology and is deleted by the scoped feasibility lifecycle.
    expired_at: 2027-08-20
  - id: KSV-0047
    paths:
      - "charts/cn5g-observability/templates/rbac.yaml"
    statement: >-
      Prometheus needs GET-only nodes/proxy access to retrieve kubelet and
      cAdvisor metrics through the authenticated Kubernetes API. The kind
      kubelet uses a node-local serving CA unavailable to Pods, so direct
      scraping would weaken TLS verification. Conftest restricts this exact
      permission to the Prometheus ClusterRole and rejects broader verbs.
    expired_at: 2027-08-20
  - id: DS-0002
    paths:
      - "containers/data-network/Dockerfile"
    statement: >-
      The Compose-only entrypoint starts with NET_ADMIN, SETUID, and SETGID to
      install one fixed N6 return route, then immediately execs the HTTP server
      as numeric UID/GID 65532 through su-exec. Kubernetes overrides the
      entrypoint and enforces non-root UID/GID 65532 with all capabilities
      dropped; static and rendered-policy tests verify both boundaries.
    expired_at: 2027-08-20

